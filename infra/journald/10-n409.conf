# /etc/systemd/journald.conf.d/10-n409.conf — installed by infra/install-journald.sh
#
# WHY THIS EXISTS: every N409 process logs to stdout and systemd puts that in
# the journal. infra/DEPLOYMENT.md says so in as many words — "other services
# (web, ai, engine-wrapper, report) write nothing to disk (logs go to the
# journal)" — and it is the journal that DEPLOYMENT.md then tells an operator to
# read when a service is OOM-killed. Nothing in this repo said how large that
# journal may grow or how long it is kept. The answer was whatever the distro
# happened to default to, on a host that also serves two unrelated products, and
# it was written down nowhere: the same shape as the systemd units before R88
# and the Caddyfile before R89 — configuration that exists only on the box.
#
# A drop-in rather than a whole journald.conf. This host is shared, the file is
# not ours to own, and `journald.conf.d/` is the interface the distro provides
# for exactly that. The `10-` prefix leaves room both above and below.
#
# Every value here is a bound, not a target: journald applies whichever limit
# binds first, so the effect is "at most this much, at most this old".

[Journal]
# Survive a reboot.
#
# The default is `auto`, which is persistent *only if* /var/log/journal already
# exists and volatile otherwise — and volatile means /run, a tmpfs. The one
# moment DEPLOYMENT.md's `journalctl -u n409-report --since '-1d' | grep -i
# 'memory\|oom\|killed'` matters most is after the box has come back up, which
# is precisely when a volatile journal has nothing left to show. `persistent`
# creates the directory rather than depending on somebody having made it.
Storage=persistent
Compress=yes

# The disk ceiling.
#
# Bounded because an unbounded journal on a single-disk host is a slow-motion
# outage with the wrong symptom: Postgres stops accepting writes when the volume
# fills, and the first sign is failed inserts rather than "the logs got big".
#
# SystemKeepFree is deliberately NOT set. Its default is 15% of the filesystem,
# which on this host is a far larger safety margin than any figure worth writing
# here; naming an absolute number would *lower* the protection while looking
# like it raised it.
SystemMaxUse=512M
# One file per rotation step, so vacuuming drops a bounded slice rather than a
# third of the history at once.
SystemMaxFileSize=64M

# The age ceiling. Log lines are operational data about client engagements, and
# "we keep them indefinitely because nobody chose a number" is not a policy.
# Thirty days outlives any incident review; the disk ceiling above usually binds
# first anyway, and that is fine — this is the floor under the answer to "how
# long could this possibly be here".
MaxRetentionSec=30day

# Rate limiting, raised rather than removed.
#
# The default is 10000 messages per 30s per service, and anything past it is
# dropped with a single "Suppressed N messages" line. A service that has started
# failing is a service that has started logging, so the default silently
# discards the evidence at exactly the moment it is being generated — five
# Fastify services plus two Python ones sharing one incident will pass 10000.
# Not disabled (RateLimitBurst=0): a genuine log loop would then be free to
# consume the whole 512M and vacuum away everything that came before it, which
# is the same evidence loss by the other route.
RateLimitIntervalSec=30s
RateLimitBurst=20000
