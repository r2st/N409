# Alerting rules for the N409 estate.
#
# ── What this file is, and what it is not ───────────────────────────────────
#
# Every service on this box exposes `GET /metrics` in the Prometheus text
# format, gated on METRICS_TOKEN (falling back to INTERNAL_SERVICE_TOKEN). The
# instruments have been accumulating for a dozen rounds. What was never written
# down is the other half of a monitoring system: *at what value is a number a
# problem*. Without that, every gauge here is a thing somebody has to already
# suspect before they go and look at it, which is the same as not having it.
#
# So this file is the thresholds, argued. It is a Prometheus rule group and can
# be loaded by one, but its first job is to be the written answer to "how would
# we know?" — and `alertRulesCensus.test.ts` holds it to the metrics the code
# actually exports, so a renamed instrument fails the suite instead of silently
# turning an alert into one that can never fire.
#
# ── Scrape configuration ────────────────────────────────────────────────────
#
# Ports 3001–3004 are firewalled from the internet and only :3000 is proxied by
# Caddy, so a scraper must run on the host. Targets:
#
#   web         127.0.0.1:3000     job_name: n409-web
#   valuation   127.0.0.1:3001     job_name: n409-valuation
#   report      127.0.0.1:3004     job_name: n409-report
#
# with `authorization: {credentials: $INTERNAL_SERVICE_TOKEN}`.
#
# ── Which label names a process, and which names a dependency ───────────────
#
# `job` — attached by the scraper to every series it collects, from the
# `job_name` above. This is the only label that says *which unit emitted this*,
# and it is therefore the one every rule about a process — its uptime, its
# memory, its request rate, its latency — must group by and name in its summary.
#
# `service` — ours, and it does not mean that. It appears on `upstream_*`, where
# it names the dependency being *called* (`engine`, `ai-service`, `report`), and
# on `n409_build_info`, where it is a fact carried in the info metric's labels.
# Five rules used to group and annotate by `service` on metrics that carry no
# such label: `sum by (service)` over `http_requests_total` put all three units
# in one series, so the estate-wide error ratio was what the page fired on and a
# low-traffic unit failing every request was diluted below the threshold by the
# healthy volume beside it — and the summaries that did fire named nobody, since
# `{{ $labels.service }}` on a series without one renders empty.
# `alertRulesCensus.test.ts` now holds every label a rule groups by, selects on
# or interpolates to one the metrics in that rule actually carry. The AI (:3002)
# and engine (:3003) services expose no scrape endpoint; they are measured from
# the caller instead — see the `upstream_*` rules below, and the note on
# `registerUpstreamMetrics` for why the caller's view is the one that decides
# whether a user saw a failure.
#
# ── Severity ────────────────────────────────────────────────────────────────
#
# `page`  — a person should look now; users are affected or about to be.
# `ticket` — real, and it will not fix itself, but it can wait for a working day.
#
# Nothing here is `info`. An alert nobody is expected to act on trains people to
# close alerts.

groups:
  - name: n409-availability
    rules:
      # `up` is the scraper's own synthetic series, not one of ours: it is the
      # only thing that can distinguish "the service is not answering" from "the
      # service is answering and reporting zero of everything", which every
      # rule below would read as health.
      - alert: ServiceDown
        expr: up{job=~"n409-.*"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} has not answered a scrape for two minutes'
          runbook: 'systemctl status n409-<unit>; journalctl -u n409-<unit> -n 200'

      # A process that keeps coming back young is crash-looping, and the crash
      # handler's own log line (shared/crash.ts) is on the stderr systemd is
      # restarting. Nothing else here would notice: every counter resets with
      # the process, so a service that restarts every ninety seconds has a
      # permanently low error rate.
      - alert: ServiceRestarting
        expr: process_uptime_seconds < 300
        for: 10m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} has restarted repeatedly in the last ten minutes'
          runbook: 'journalctl -u n409-<unit> -n 200 — look for uncaughtException/unhandledRejection'

      # A partial deploy. `deploy.sh` rsyncs, builds and restarts five units, and
      # a unit that fails to come back on the new code does not fail its
      # readiness probe — it is perfectly healthy, on yesterday's build. So the
      # estate serves a mixture: the web tier calling a valuation tier that
      # predates the contract it is calling with, or a rollback that took on two
      # units out of three. Nothing here noticed, and `n409_build_info` — the
      # gauge written so that "what is live" is answerable from outside the box —
      # had no rule against it at all.
      #
      # Covers the three Node units, which are the three that register this
      # gauge. The two Python units carry their own `build_info` and have no
      # scrape endpoint to publish it on; that is R313's open item, and a unit
      # this rule cannot see is a reason to close it rather than to weaken the
      # rule.
      #
      # Counting distinct `sha` rather than comparing to any expected value:
      # there is nothing on the box that knows what the intended build is, and
      # the question worth asking does not need one. Two builds live at once is
      # wrong however it happened.
      #
      # `for` spans a deploy: the units restart one at a time and the estate is
      # legitimately mixed for the seconds in between.
      - alert: EstateBuildSkew
        expr: count(count by (sha) (n409_build_info)) > 1
        for: 15m
        labels: { severity: page }
        annotations:
          summary: 'the estate is running more than one build'
          runbook: 'sum by (service, sha) (n409_build_info) — then re-run deploy.sh for the odd one out'

      # And the case that makes the rule above unable to fire: no unit knows what
      # it is running. `buildInfo` falls back to `sha: unknown` when neither
      # BUILD_SHA nor the file the deploy writes is readable, which every service
      # does independently — so a deploy that stopped writing BUILD_SHA leaves
      # all five agreeing on 'unknown', skew-free and provenance-free. Every
      # dashboard that joins a series to a commit, and every rollback decision,
      # is guessing from that point on, silently.
      - alert: BuildProvenanceMissing
        expr: n409_build_info{source="unknown"} == 1
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} cannot say which commit it is running'
          runbook: 'cat /opt/N409/BUILD_SHA; check deploy.sh wrote it and the unit can read it'

      # The cgroup limiter SIGKILLs a unit over MemoryMax and systemd restarts
      # it, leaving nothing in the process's own output to say why. This is the
      # warning that comes before that.
      - alert: MemoryNearCgroupLimit
        expr: n409_cgroup_memory_current_bytes / n409_cgroup_memory_max_bytes > 0.9
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.job }} is within 10% of its MemoryMax'

  - name: n409-http
    rules:
      # Rate, not count: "forty 5xx" means nothing without knowing whether that
      # was forty requests or forty thousand. Five per cent sustained for five
      # minutes is well clear of one bad client and well short of an outage.
      - alert: HighServerErrorRate
        expr: |
          sum by (job) (rate(http_request_errors_total[5m]))
            / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} is failing more than 5% of requests'

      # The other shape of a service in trouble: not failing, just not
      # finishing. Requests pile up in flight when the event loop is blocked or
      # every handler is waiting on the same dependency.
      - alert: RequestsPilingUp
        expr: http_requests_in_flight > 100
        for: 5m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} is holding over 100 requests at once'

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[10m]))) > 2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.job }} p95 request latency is over two seconds'

  - name: n409-dependencies
    rules:
      # The platform has stopped calling a dependency altogether. Pages: every
      # feature behind it is reporting itself unavailable to users right now.
      - alert: UpstreamCircuitOpen
        expr: upstream_circuit_state{state="open"} == 1
        for: 2m
        labels: { severity: page }
        annotations:
          summary: 'circuit open for {{ $labels.service }} — it is not being called at all'
          runbook: 'GET /api/v1/admin/system/metrics for the breaker snapshot and what opened it'

      # Before the breaker gives up. Five consecutive transient failures is the
      # threshold; three is the window in which somebody can still get ahead of
      # it.
      - alert: UpstreamFailing
        expr: upstream_circuit_consecutive_failures >= 3
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} is failing repeatedly and is close to being cut off'

      # `failed` only — deliberately not `rejected`. A run of 4xx from the
      # engine is this platform sending it payloads it will not accept, which is
      # a bug in a route and not an outage in a dependency, and folding the two
      # into one error rate is how the alert stops meaning anything.
      - alert: UpstreamErrorRate
        expr: |
          sum by (service) (rate(upstream_requests_total{outcome=~"failed|timeout|unreachable"}[10m]))
            / sum by (service) (rate(upstream_requests_total[10m])) > 0.1
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'more than 10% of calls to {{ $labels.service }} are failing'

      # An upstream slow enough to burn the request budget fills this service's
      # handlers, which is the cascade the breaker exists for. Sixty seconds is
      # half the default budget.
      - alert: UpstreamSlow
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(upstream_request_duration_seconds_bucket[15m]))) > 60
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} p95 is over a minute; requests are approaching the deadline'

      # A dependency being down is expected to produce refusals. A *rising*
      # refusal count while the breaker is closed is not, and means calls are
      # being lost to a breaker that keeps flapping.
      - alert: UpstreamCallsRefusedLocally
        expr: rate(upstream_circuit_rejected_total[15m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'calls to {{ $labels.service }} have been refused locally for half an hour'

  - name: n409-background
    rules:
      # A sweep failing on every tick reads through the saturation gauges
      # exactly as a healthy idle one does — it fails and returns long before a
      # scrape, so `running` is 0 and nothing overlaps, so `skipped` is 0. This
      # is the rule those two could not express.
      - alert: SweepFailing
        expr: |
          rate(background_sweep_failures_total[30m]) / rate(background_sweep_runs_total[30m]) > 0.5
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep is failing more often than it succeeds'
          runbook: 'journalctl -u n409-valuation | grep ''"sweep":"{{ $labels.sweep }}"'''

      # And the opposite failure: a sweep that is not running at all. The timer
      # was never scheduled, or the interval is configured to zero. Every retry
      # ladder on this platform is a sweep.
      #
      # Anchored on `background_sweep_enabled` rather than on the run counter
      # alone, and that is the whole of R321's correction here: a sweep behind a
      # `_MINUTES > 0` switch that is switched off used not to be registered at
      # all, so it had no `background_sweep_runs_total` series, and
      # `rate(...) == 0` over a series that does not exist matches nothing. The
      # second half of the sentence above — "or the interval is configured to
      # zero" — was the one case this rule could not see. `enabled` now carries
      # a reading for every sweep the process knows of, so `unless` catches both
      # the enabled sweep whose timer has stopped and, should the roster and the
      # gauges ever drift apart again, the enabled sweep with no counter at all.
      #
      # Deliberately no rule on `background_sweep_enabled == 0`: a deployment
      # turning a sweep off is supported, and the boot line
      # ('background sweeps: not all scheduled', warn) is where an unintended
      # one is caught. What was missing was any way to tell "off" from "gone".
      - alert: SweepStopped
        expr: |
          background_sweep_enabled == 1 unless (rate(background_sweep_runs_total[1h]) > 0)
        for: 1h
        labels: { severity: page }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep has not run for an hour'

      # A scheduler routinely skipping ticks has an interval too short for its
      # work — the queue behind it is growing and nothing else says so.
      - alert: SweepOverlapping
        expr: rate(background_sweep_skipped_total[30m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep is skipping ticks; its interval is too short'

      # The three rules above describe the *tick*: whether it ran, whether it
      # overlapped, whether it threw. None of them describes the work, and the
      # work is where these sweeps fail. Every ladder here contains its per-row
      # failures on purpose — one row's SMTP refusal must not cost the other
      # nineteen their attempt — so an outbox whose every send is refused, a
      # webhook receiver that has been 500ing since yesterday, and a retry sweep
      # stranding every run it claims all return normally, every tick, for ever.
      # `background_sweep_items_total` is the tally each tick already computed.
      - alert: SweepWorkFailing
        expr: |
          rate(background_sweep_items_total{outcome="failed"}[30m]) > 0
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep has been failing rows for an hour'
          runbook: 'journalctl -u n409-valuation | grep ''"sweep":"{{ $labels.sweep }}"'''

      # The ladder giving up. `retired` and `stranded` are the two endings no
      # later tick revisits — an outbox row whose attempts are spent, a pipeline
      # run abandoned mid-claim — so unlike `failed` there is no next attempt
      # that might make this right, and one is worth a look.
      - alert: SweepAbandoningWork
        expr: |
          increase(background_sweep_items_total{outcome=~"retired|stranded"}[6h]) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep has given up on rows nothing else will take'

      # An outcome the database refused to record, for a POST that had already
      # reached the receiver. `unsettled` is deliberately not `failed`: the
      # partner *got* the event, only the row does not say so, so the claim
      # lapsing sends it a second time. One is a blip on one statement; a rate
      # that does not fall is a partner processing duplicates of every event.
      - alert: WebhookOutcomesUnrecorded
        expr: |
          rate(background_sweep_items_total{sweep="webhook-retry",outcome="unsettled"}[30m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'partner webhook outcomes are going unrecorded — receivers are being sent duplicates'
          runbook: "journalctl -u n409-valuation | grep 'could not be settled'"

      # The alerting subsystem failing to report. `announceJobAlerts` retries
      # an announcement until it lands, so one failure is a database blip and
      # not news — but a count that keeps rising is an operator who has not been
      # told a queue is stalled, which is the one failure the job monitor exists
      # to prevent, and it reaches nothing else here.
      - alert: JobAlertAnnouncementsFailing
        expr: |
          rate(background_sweep_items_total{sweep="job-alerts",outcome="announcements_failed"}[30m]) > 0
        for: 30m
        labels: { severity: page }
        annotations:
          summary: 'job queue alerts have been failing to reach an operator for half an hour'
          runbook: "journalctl -u n409-valuation | grep 'job queue alert announcement failed'"

      # The queues themselves, as the job monitor judges them. `stalled` is the
      # oldest job that is *due now* having been due longer than the queue's
      # window — a stopped worker or a dead SMTP host; `failing` is a queue
      # moving fine and getting every answer wrong. Both thresholds are the
      # per-queue rules in `job_alert_rules`, so this rule deliberately restates
      # no number of its own: the judgement is already made, and until R321 it
      # was made every five minutes and told only an in-app notification list.
      #
      # `for` is short because the sweep's own reconciler is the de-duplicator:
      # an alert here has already survived a scan, and it stays open until the
      # condition clears.
      - alert: JobQueueAlertOpen
        expr: job_queue_alert_open == 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.source }} queue is {{ $labels.kind }}, per the job monitor'
          runbook: 'https://n409.aiknol.com/admin/jobs'

      # The gauge above is the monitor's verdict; this is whether it reached one.
      # A queue with no enabled rule produces no findings, so before R329 it
      # reported the same confident zero as a healthy watched one and
      # `JobQueueAlertOpen` could never fire for it again — for the outbox and
      # the webhook deliveries, that zero was the only thing anybody had, since
      # `auto_pipeline_runs_pending` delegates every DB-backed backlog here.
      #
      # Deliberately no rule on `state="disabled"`: switching a queue's rule off
      # in the admin console is supported, the same way a switched-off sweep is.
      # `unconfigured` is the one nobody chose — a source in JOB_SOURCES with no
      # row in `job_alert_rules`, unwatched since the day it was added.
      - alert: JobQueueUnwatched
        expr: job_queue_alert_rule{state="unconfigured"} == 1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.source }} queue has no alert rule at all — nothing is watching it'
          runbook: 'INSERT a row into job_alert_rules for it; the seed in migration 0120 has the thresholds the others use'

      - alert: AutoPipelineBacklog
        expr: auto_pipeline_runs_pending > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'auto-pipeline runs have been queued behind the concurrency limit for half an hour'

  - name: n409-database
    rules:
      # Anything waiting means the pool is saturated: the next query does not
      # run slowly, it does not run.
      - alert: PoolSaturated
        expr: db_pool_connections_waiting > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'callers are queued for a pg client'

      # A leaked checkout never comes back on its own, so any increase is
      # permanent loss of pool capacity.
      - alert: PoolCheckoutLeaked
        expr: increase(db_pool_checkouts_leaked_total[1h]) > 0
        labels: { severity: page }
        annotations:
          summary: 'a pg connection was checked out and never returned'
          runbook: 'GET /api/v1/admin/db/pool; db/poolHealth.ts holds the stack of the oldest checkout'

      - alert: PoolCheckoutHeldTooLong
        expr: db_pool_checkout_oldest_seconds > 60
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: 'a pg connection has been held for over a minute'

      - alert: SlowQueriesAppearing
        expr: increase(db_slow_queries_total[15m]) > 20
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'statements are crossing the slow-query threshold'
          runbook: 'GET /api/v1/admin/db/queries for the ranked fingerprints'

  - name: n409-degraded-features
    rules:
      # The fallback keeps producing correct bytes, so a broken offload has no
      # other symptom — this process simply goes back to blocking its event loop
      # for half a second per report. `not_configured` is the deployment that
      # deliberately has no report unit and is excluded.
      - alert: ReportOffloadFailing
        expr: rate(report_render_total{mode="local", reason!="not_configured"}[30m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'PDF renders are falling back to the valuation process ({{ $labels.reason }})'

      - alert: ReportRenderQueueFull
        expr: report_render_delegations_queued > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'report renders are queueing for a delegation slot'

      # The engine turns every market-data failure into a 200 with
      # `source: "fallback"`, so a dead source produces correct-looking
      # valuations on substituted figures. There is no other symptom at all.
      - alert: MarketFeedFallingBack
        expr: |
          sum(rate(market_feed_answers_total{outcome="fallback"}[1h]))
            / sum(rate(market_feed_answers_total[1h])) > 0.5
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: 'over half of market-feed answers are substituted figures rather than observed ones'

  - name: n409-inbound-webhooks
    rules:
      # A webhook's whole authority is a signature, and the secret behind it is
      # held on two machines neither of which tells the other when it changes.
      # A rotation in the Stripe dashboard that misses this deployment refuses
      # every delivery: no payment is fulfilled, no refund recorded, no
      # subscription changes state, and a customer who has been charged has an
      # engagement that is still unpaid. `registerProblemHandler` leaves 4xx
      # unlogged on purpose — right for a browser, wrong for the one caller that
      # is a machine and cannot tell anybody it is being turned away.
      #
      # A ratio, not a count. These URLs are in PUBLIC_ROUTES and the internet
      # scans them, so a nonzero refusal rate is the normal condition of an
      # endpoint on the internet. What is not normal is refusing most of what
      # arrives — and `unsigned` is deliberately excluded from the numerator,
      # because a scanner POSTing junk is exactly the traffic that must not be
      # able to page somebody.
      - alert: InboundWebhookSecretDrifted
        expr: |
          sum by (source) (rate(inbound_webhook_deliveries_total{outcome="bad_signature"}[30m]))
            / sum by (source) (rate(inbound_webhook_deliveries_total{outcome!="unsigned"}[30m])) > 0.5
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "the {{ $labels.source }} webhook is refusing signed deliveries — its secret and the sender's have drifted"
          runbook: "journalctl -u n409-valuation | grep inbound_webhook — then compare the endpoint secret in the provider dashboard with this deployment's"

      # The other half: the door is open and nothing is behind it. A deploy that
      # brought up the service without the secret answers every delivery 503,
      # the provider retries for days and gives up, and the events are gone.
      - alert: InboundWebhookUnconfigured
        expr: rate(inbound_webhook_deliveries_total{outcome="unconfigured"}[1h]) > 0
        for: 15m
        labels: { severity: page }
        annotations:
          summary: 'the {{ $labels.source }} webhook is being called and has no signing secret configured'

  - name: n409-identity
    rules:
      # An SSO refusal is a 302. R273 said so in as many words when it gave
      # these refusals a log line: "a refusal that becomes a 302 is a 302 in the
      # access log, indistinguishable from the successful hand-off two lines
      # below it". The half that was left is that the log is not the alerting
      # channel here.
      #
      # So an expired IdP signing certificate, a rotated Google client secret or
      # an administrator narrowing the allowed domain refuses every sign-in at a
      # firm, and each refusal is counted by `http_requests_total` in the 3xx
      # class beside every ordinary redirect on the platform. No 5xx, no slow
      # request, no circuit — the IdP is not one of ours. Nobody can sign in and
      # every other instrument reads green.
      #
      # A ratio against `signed_in`, and sustained: one person with a personal
      # address hitting `domain_not_allowed` is Tuesday. Half an hour in which
      # most attempts are refused is a setting somebody changed.
      - alert: SsoRefusingSignIns
        expr: |
          sum by (flow) (rate(sso_outcomes_total{outcome!="signed_in"}[30m]))
            / sum by (flow) (rate(sso_outcomes_total[30m])) > 0.5
        for: 30m
        labels: { severity: page }
        annotations:
          summary: 'most {{ $labels.flow }} sign-in attempts are being refused'
          runbook: "journalctl -u n409-valuation | grep ssoRefusal — the code names which of the ten reasons, and half of them are a setting inside the firm's own identity provider"

      # The two codes that are never a caller's doing. `assertion_rejected` is a
      # signature, a condition window or a profile we will not trust;
      # `provider_error` is the IdP not answering usefully at all. Either one
      # arriving at any rate is worth a look before it becomes the rule above,
      # and unlike that ratio this fires on the first firm to hit it rather than
      # waiting for them to outnumber everybody signing in successfully.
      - alert: SsoProviderRejecting
        expr: |
          sum by (flow) (rate(sso_outcomes_total{outcome=~"assertion_rejected|provider_error"}[30m])) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.flow }} assertions are being rejected or the provider is not answering'

  - name: n409-browser
    rules:
      # A release that blanks a route for every user leaves the access log full
      # of 200s: the shell and the bundle both serve fine. This counter is the
      # only thing on the box that can see it.
      - alert: ClientCrashSpike
        expr: sum(rate(client_errors_total[10m])) > 0.2
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'the browser app is crashing for users — check the last release'
          runbook: 'journalctl -u n409-valuation | grep client_error — the stack and page are on the line'

      # The reports are throttled per address, so this firing means the counter
      # above is capped and is no longer the whole story.
      - alert: ClientCrashReportsDropped
        expr: rate(client_errors_dropped_total[15m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'crash reports are being refused by the throttle; client_errors_total is an undercount'
