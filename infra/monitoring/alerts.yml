# Alerting rules for the N409 estate.
#
# ── What this file is, and what it is not ───────────────────────────────────
#
# Every service on this box exposes `GET /metrics` in the Prometheus text
# format, gated on METRICS_TOKEN (falling back to INTERNAL_SERVICE_TOKEN). The
# instruments have been accumulating for a dozen rounds. What was never written
# down is the other half of a monitoring system: *at what value is a number a
# problem*. Without that, every gauge here is a thing somebody has to already
# suspect before they go and look at it, which is the same as not having it.
#
# So this file is the thresholds, argued. It is a Prometheus rule group and can
# be loaded by one, but its first job is to be the written answer to "how would
# we know?" — and `alertRulesCensus.test.ts` holds it to the metrics the code
# actually exports, so a renamed instrument fails the suite instead of silently
# turning an alert into one that can never fire.
#
# ── Scrape configuration ────────────────────────────────────────────────────
#
# Ports 3001–3004 are firewalled from the internet and only :3000 is proxied by
# Caddy, so a scraper must run on the host. Targets:
#
#   web         127.0.0.1:3000     job_name: n409-web
#   valuation   127.0.0.1:3001     job_name: n409-valuation
#   report      127.0.0.1:3004     job_name: n409-report
#
# with `authorization: {credentials: $INTERNAL_SERVICE_TOKEN}`.
#
# ── Which label names a process, and which names a dependency ───────────────
#
# `job` — attached by the scraper to every series it collects, from the
# `job_name` above. This is the only label that says *which unit emitted this*,
# and it is therefore the one every rule about a process — its uptime, its
# memory, its request rate, its latency — must group by and name in its summary.
#
# `service` — ours, and it does not mean that. It appears on `upstream_*`, where
# it names the dependency being *called* (`engine`, `ai-service`, `report`), and
# on `n409_build_info`, where it is a fact carried in the info metric's labels.
# Five rules used to group and annotate by `service` on metrics that carry no
# such label: `sum by (service)` over `http_requests_total` put all three units
# in one series, so the estate-wide error ratio was what the page fired on and a
# low-traffic unit failing every request was diluted below the threshold by the
# healthy volume beside it — and the summaries that did fire named nobody, since
# `{{ $labels.service }}` on a series without one renders empty.
# `alertRulesCensus.test.ts` now holds every label a rule groups by, selects on
# or interpolates to one the metrics in that rule actually carry. The AI (:3002)
# and engine (:3003) services expose no scrape endpoint; they are measured from
# the caller instead — see the `upstream_*` rules below, and the note on
# `registerUpstreamMetrics` for why the caller's view is the one that decides
# whether a user saw a failure.
#
# ── Severity ────────────────────────────────────────────────────────────────
#
# `page`  — a person should look now; users are affected or about to be.
# `ticket` — real, and it will not fix itself, but it can wait for a working day.
#
# Nothing here is `info`. An alert nobody is expected to act on trains people to
# close alerts.

groups:
  - name: n409-availability
    rules:
      # `up` is the scraper's own synthetic series, not one of ours: it is the
      # only thing that can distinguish "the service is not answering" from "the
      # service is answering and reporting zero of everything", which every
      # rule below would read as health.
      - alert: ServiceDown
        expr: up{job=~"n409-.*"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} has not answered a scrape for two minutes'
          runbook: 'systemctl status n409-<unit>; journalctl -u n409-<unit> -n 200'

      # A process that keeps coming back young is crash-looping, and the crash
      # handler's own log line (shared/crash.ts) is on the stderr systemd is
      # restarting. Nothing else here would notice: every counter resets with
      # the process, so a service that restarts every ninety seconds has a
      # permanently low error rate.
      - alert: ServiceRestarting
        expr: process_uptime_seconds < 300
        for: 10m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} has restarted repeatedly in the last ten minutes'
          runbook: 'journalctl -u n409-<unit> -n 200 — look for uncaughtException/unhandledRejection'

      # A partial deploy. `deploy.sh` rsyncs, builds and restarts five units, and
      # a unit that fails to come back on the new code does not fail its
      # readiness probe — it is perfectly healthy, on yesterday's build. So the
      # estate serves a mixture: the web tier calling a valuation tier that
      # predates the contract it is calling with, or a rollback that took on two
      # units out of three. Nothing here noticed, and `n409_build_info` — the
      # gauge written so that "what is live" is answerable from outside the box —
      # had no rule against it at all.
      #
      # Covers the three Node units, which are the three that register this
      # gauge. The two Python units carry their own `build_info` and have no
      # scrape endpoint to publish it on; that is R313's open item, and a unit
      # this rule cannot see is a reason to close it rather than to weaken the
      # rule.
      #
      # Counting distinct `sha` rather than comparing to any expected value:
      # there is nothing on the box that knows what the intended build is, and
      # the question worth asking does not need one. Two builds live at once is
      # wrong however it happened.
      #
      # `for` spans a deploy: the units restart one at a time and the estate is
      # legitimately mixed for the seconds in between.
      - alert: EstateBuildSkew
        expr: count(count by (sha) (n409_build_info)) > 1
        for: 15m
        labels: { severity: page }
        annotations:
          summary: 'the estate is running more than one build'
          runbook: 'sum by (service, sha) (n409_build_info) — then re-run deploy.sh for the odd one out'

      # And the case that makes the rule above unable to fire: no unit knows what
      # it is running. `buildInfo` falls back to `sha: unknown` when neither
      # BUILD_SHA nor the file the deploy writes is readable, which every service
      # does independently — so a deploy that stopped writing BUILD_SHA leaves
      # all five agreeing on 'unknown', skew-free and provenance-free. Every
      # dashboard that joins a series to a commit, and every rollback decision,
      # is guessing from that point on, silently.
      - alert: BuildProvenanceMissing
        expr: n409_build_info{source="unknown"} == 1
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} cannot say which commit it is running'
          runbook: 'cat /opt/N409/BUILD_SHA; check deploy.sh wrote it and the unit can read it'

      # The cgroup limiter SIGKILLs a unit over MemoryMax and systemd restarts
      # it, leaving nothing in the process's own output to say why. This is the
      # warning that comes before that.
      #
      # The denominator is filtered, not divided by raw, and the `> 0` is doing
      # real work rather than being defensive (R337, methodology M11).
      # `n409_cgroup_memory_max_bytes` is documented as "MemoryMax for this
      # unit, or 0 when unlimited", and 0 was chosen deliberately: `cgroupMemory.ts`
      # says a ceiling of zero is impossible, so the value is unambiguous and
      # "this unit has no limit" becomes something a rule can match. Dividing by
      # it turns exactly that case into `current / 0` — `+Inf` in PromQL, which
      # is greater than 0.9 — so a unit with no ceiling raised a ticket that
      # could never be closed and said the opposite of the truth while doing it.
      # `(metric > 0)` is a filter: it keeps the series and its value, and drops
      # the reading that means "there is nothing to be near".
      - alert: MemoryNearCgroupLimit
        expr: n409_cgroup_memory_current_bytes / (n409_cgroup_memory_max_bytes > 0) > 0.9
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.job }} is within 10% of its MemoryMax'

      # And the case the filter above now drops, which is a finding of its own
      # and had no rule at all. R99 gave all five units a MemoryMax on the
      # argument that the box is 3.8 GB and one unit's leak must not be allowed
      # to take the other four down with it. A unit whose ceiling has gone —
      # an edited unit file, a drop-in, a hand-started process — is back to
      # exactly that, and every other memory instrument keeps reading normally
      # right up until the host OOM killer picks a victim that need not be the
      # process at fault.
      #
      # Paired with `current > 0` rather than standing alone: off Linux and on
      # a cgroup v1 host `cgroupMemory.ts` reports 0 for *every* field, so the
      # bare `max == 0` is also what a laptop looks like. A readable cgroup
      # always charges a running process something, so the pair says "we can
      # read the cgroup, and it has no ceiling".
      - alert: MemoryCeilingMissing
        expr: n409_cgroup_memory_max_bytes == 0 and n409_cgroup_memory_current_bytes > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.job }} is running with no MemoryMax; a leak here takes the whole box'
          runbook: 'systemctl show n409-<unit> -p MemoryMax; infra/systemd holds the intended value'

      # And the instrument that was written to be the early warning, which no
      # rule read (R345, methodology M11).
      #
      # `cgroupMemory.ts` exports `memory.events` as five labelled counters and
      # argues at length for why: `high` counts times the cgroup was throttled
      # at `MemoryHigh`, `max` counts times an allocation was about to breach
      # `MemoryMax` and reclaim was forced, and — its words — "the first two are
      # the early warning; they tick long before anything dies". Nothing in this
      # file selected any of the five. The family was exported, scraped and read
      # by nobody, which is the same as not having it.
      #
      # It is not covered by `MemoryNearCgroupLimit` beside it. That rule samples
      # an instantaneous ratio and needs it held for ten minutes, so it sees a
      # unit that grows into its ceiling and sits there. The failure this estate
      # actually has is the other shape: a report render or a workbook import
      # allocates hard inside one request, the cgroup forces reclaim, and either
      # the request dies or the unit does — between two fifteen-second scrapes,
      # with the ratio never observed above 0.9 for ten consecutive minutes.
      # These counters are monotonic within a process lifetime, so one scrape
      # after the event is enough to see it; that is the whole difference.
      #
      # `increase(...)` rather than `> 0`: the counters reset only when the unit
      # restarts, so a bare comparison is sticky — a unit that touched its
      # ceiling once at boot and has been healthy for a month would hold the
      # alert open the whole time. A window asks the question worth asking,
      # which is whether it is happening now.
      - alert: CgroupMemoryReclaimForced
        expr: increase(n409_cgroup_memory_events{event="max"}[15m]) > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} has hit MemoryMax and been forced into reclaim'
          runbook: 'the cgroup OOM kill is what comes next — n409_cgroup_memory_peak_bytes vs _max_bytes, then raise MemoryMax in infra/systemd or find the allocation'

      # `MemoryHigh` is throttling rather than killing: the kernel stalls the
      # allocating task and reclaims. Nothing fails, so no other signal here
      # moves — the unit simply gets slower, which arrives as `SlowRequests` with
      # no cause attached. A ticket, because it is the sizing conversation and
      # not an incident.
      #
      # Fires only where `MemoryHigh` is set: `n409_cgroup_memory_high_bytes` is
      # documented "or 0 when unset", and an unset threshold means this counter
      # can never tick. That is a rule that matches nothing rather than a wrong
      # one, and it is the right way round — the day a drop-in sets MemoryHigh,
      # this is already watching it.
      - alert: CgroupMemoryThrottling
        expr: increase(n409_cgroup_memory_events{event="high"}[30m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.job }} is being throttled at MemoryHigh and reclaiming under load'
          runbook: 'systemctl show n409-<unit> -p MemoryHigh -p MemoryMax; compare with n409_cgroup_memory_peak_bytes'

      # The kill itself, best-effort and knowingly so.
      #
      # systemd destroys a unit's cgroup on stop and makes a fresh one on start,
      # so a unit whose *main* process is killed comes back reporting
      # `oom_kill 0` and this rule never sees it — `ServiceRestarting` is the
      # signal for that case and the journal is the durable record. What this
      # does catch is the case nothing else here can: a kill that does not take
      # the unit down. The cgroup OOM handler picks a process, not the service,
      # so a child that is killed leaves the unit up, healthy on every other
      # instrument, and the counter standing at 1 until the next restart.
      #
      # Bare `> 0`, not a window: with the reset semantics above, any non-zero
      # reading is a kill this process has outlived, and it clears itself the
      # moment the unit restarts.
      - alert: CgroupOomKill
        expr: n409_cgroup_memory_events{event="oom_kill"} > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} has had a process killed by the cgroup OOM handler'
          runbook: 'journalctl -u n409-<unit> --grep=oom; the unit is still up, so something under it is not'

  - name: n409-disk
    rules:
      # The other finite resource on this box, and the one that had no gauge at
      # all until R353.
      #
      # Memory has had a ceiling since R99, a reading of it since R337 and four
      # rules since. A full disk has the wider blast radius and arrived with no
      # lead time whatsoever: PostgreSQL stops accepting writes, so every write
      # on the estate answers `503 database-unavailable` — which is
      # `databaseUnavailableReason` working exactly as designed and says nothing
      # about the cause; uploads fail at `open` with ENOSPC; the nightly dump
      # has nowhere to land on precisely the day somebody wants to restore from
      # it; and the journal that would describe all three is the first thing
      # dropped. Every one of those is a symptom after the fact.
      #
      # Reported from the valuation unit only, which is the one that owns
      # `DOCUMENTS_DIR`. This host has one volume — the cluster, the documents
      # and the journal share it — so one reading answers for the box, and three
      # units reporting the same filesystem would be three pages for one
      # condition. `mount` is the role rather than the device: what an operator
      # needs first is what stops working.
      #
      # `bavail`, not `bfree`: ext4 reserves 5% for root, so a service running as
      # `n409` hits ENOSPC with the naive free-space figure still comfortable.
      #
      # A ratio and not an absolute, for the reason `HighServerErrorRate` is a
      # ratio: "eight gigabytes left" is a different situation on a 40 GB volume
      # and on a 400 GB one, and the volume is resized without anybody
      # remembering this file.
      - alert: DiskFillingUp
        expr: |
          n409_disk_available_bytes / (n409_disk_total_bytes > 0) < 0.15
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.mount }} filesystem is over 85% full'
          runbook: 'du -xh --max-depth=2 / | sort -h | tail -30; the usual three are the documents directory, /var/lib/postgresql and the journal (journalctl --vacuum-size=200M)'

      # The same reading past the point where it is somebody's Tuesday.
      #
      # `for` is short on purpose. The gap between the two thresholds is not
      # time, it is room: a volume that has gone from 15% free to 5% free is one
      # that is filling from something still running, and what is left is the
      # margin in which a person can still SSH in, write a file and take a dump
      # of the database. Waiting out a long window here spends exactly that.
      - alert: DiskNearlyFull
        expr: |
          n409_disk_available_bytes / (n409_disk_total_bytes > 0) < 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'the {{ $labels.mount }} filesystem is over 95% full — writes are about to start failing'
          runbook: 'PostgreSQL refusing writes and uploads failing with ENOSPC are the next symptoms, and both read as an application outage. Free space before diagnosing anything else.'

  - name: n409-http
    rules:
      # Rate, not count: "forty 5xx" means nothing without knowing whether that
      # was forty requests or forty thousand. Five per cent sustained for five
      # minutes is well clear of one bad client and well short of an outage.
      - alert: HighServerErrorRate
        expr: |
          sum by (job) (rate(http_request_errors_total[5m]))
            / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} is failing more than 5% of requests'

      # The other shape of a service in trouble: not failing, just not
      # finishing. Requests pile up in flight when the event loop is blocked or
      # every handler is waiting on the same dependency.
      - alert: RequestsPilingUp
        expr: http_requests_in_flight > 100
        for: 5m
        labels: { severity: page }
        annotations:
          summary: '{{ $labels.job }} is holding over 100 requests at once'

      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[10m]))) > 2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.job }} p95 request latency is over two seconds'

      # The endpoint reporting on itself.
      #
      # Every instrument is capped at 200 distinct label sets and folds
      # everything past that into one reserved `__other__` series. Totals stay
      # exact — which is why the three rules above are untouched by a fold, they
      # all `sum by (job)` — but a rule that *selects* a label value matches the
      # folded readings no longer, because they are filed under `__other__`.
      # `WebhookOutcomesUnrecorded`, `JobAlertAnnouncementsFailing`,
      # `SweepAbandoningWork`, `ScimThrottled` and every SSO rule are that shape.
      # Such a rule stops watching its condition and starts matching nothing,
      # which is what a healthy system looks like from here.
      #
      # `http_request*` excluded deliberately, and it is the whole calibration of
      # this rule. `route` comes from a URL path: this estate serves over four
      # hundred of them, so those three instruments are *expected* to fold, and
      # losing per-route attribution to keep an exact total is the trade the cap
      # was written to make. Every other instrument here carries a closed label
      # domain — a sweep name, an outcome word, a circuit state — small enough
      # that folding one is not the cap working as designed but label values
      # nobody declared: a caller-supplied string reaching a label, or a
      # vocabulary that has grown past the list it was written from.
      # And the harder half of the same question: a gauge that is not in the
      # body at all.
      #
      # `ObservableGauge` samples at scrape time, and a `collect` that throws
      # must not fail the whole scrape — an endpoint that 500s because a pool
      # handle went away is down exactly when it is needed. So the gauge is
      # dropped and the scrape continues, and an absent series is the one thing
      # a rule cannot tell apart from a healthy one.
      #
      # Most of the page-severity rules on this page are gauge-backed:
      # `SweepStopped` reads `background_sweep_enabled`, `UpstreamCircuitOpen`
      # reads `upstream_circuit_state`, `PoolSaturated` reads
      # `db_pool_connections_waiting`, `JobQueueAlertOpen` reads the job
      # monitor's snapshot, `MemoryCeilingMissing` reads the cgroup. A `collect`
      # that throws on every scrape takes its rule with it, for as long as the
      # process lives, and until R341 left nothing behind to say so.
      #
      # `increase`, not a ratio: one throw is one scrape in which a rule was not
      # being evaluated against anything, and there is no benign rate of that.
      - alert: MetricCollectFailing
        expr: increase(n409_metric_collect_failures_total[30m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.metric }} is throwing when scraped — it is absent from /metrics and every rule reading it is matching nothing'
          runbook: "journalctl -u n409-{{ $labels.job }}; the gauge's `collect` runs inside the scrape and must be cheap, synchronous and non-throwing"

      - alert: MetricAttributionFolded
        expr: n409_metric_series_folded{metric!~"http_request.*"} == 1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.metric }} has run out of label sets — rules selecting on its labels are matching less than they did'
          runbook: 'compare n409_metric_series{metric="{{ $labels.metric }}"} against the 200 in MAX_SERIES_PER_METRIC; the fix is the unbounded label, not the cap'

  - name: n409-dependencies
    rules:
      # The platform has stopped calling a dependency altogether. Pages: every
      # feature behind it is reporting itself unavailable to users right now.
      - alert: UpstreamCircuitOpen
        expr: upstream_circuit_state{state="open"} == 1
        for: 2m
        labels: { severity: page }
        annotations:
          summary: 'circuit open for {{ $labels.service }} — it is not being called at all'
          runbook: 'GET /api/v1/admin/system/metrics for the breaker snapshot and what opened it'

      # Before the breaker gives up. Five consecutive transient failures is the
      # threshold; three is the window in which somebody can still get ahead of
      # it.
      - alert: UpstreamFailing
        expr: upstream_circuit_consecutive_failures >= 3
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} is failing repeatedly and is close to being cut off'

      # `failed` only — deliberately not `rejected`. A run of 4xx from the
      # engine is this platform sending it payloads it will not accept, which is
      # a bug in a route and not an outage in a dependency, and folding the two
      # into one error rate is how the alert stops meaning anything.
      - alert: UpstreamErrorRate
        expr: |
          sum by (service) (rate(upstream_requests_total{outcome=~"failed|timeout|unreachable"}[10m]))
            / sum by (service) (rate(upstream_requests_total[10m])) > 0.1
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'more than 10% of calls to {{ $labels.service }} are failing'

      # An upstream slow enough to burn the request budget fills this service's
      # handlers, which is the cascade the breaker exists for. Sixty seconds is
      # half the default budget.
      - alert: UpstreamSlow
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(upstream_request_duration_seconds_bucket[15m]))) > 60
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} p95 is over a minute; requests are approaching the deadline'

      # A dependency being down is expected to produce refusals. A *rising*
      # refusal count while the breaker is closed is not, and means calls are
      # being lost to a breaker that keeps flapping.
      - alert: UpstreamCallsRefusedLocally
        expr: rate(upstream_circuit_rejected_total[15m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'calls to {{ $labels.service }} have been refused locally for half an hour'

  - name: n409-background
    rules:
      # A sweep failing on every tick reads through the saturation gauges
      # exactly as a healthy idle one does — it fails and returns long before a
      # scrape, so `running` is 0 and nothing overlaps, so `skipped` is 0. This
      # is the rule those two could not express.
      - alert: SweepFailing
        expr: |
          rate(background_sweep_failures_total[30m]) / rate(background_sweep_runs_total[30m]) > 0.5
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep is failing more often than it succeeds'
          runbook: 'journalctl -u n409-valuation | grep ''"sweep":"{{ $labels.sweep }}"'''

      # And the opposite failure: a sweep that is not running at all. The timer
      # was never scheduled, or the interval is configured to zero. Every retry
      # ladder on this platform is a sweep.
      #
      # Anchored on `background_sweep_enabled` rather than on the run counter
      # alone, and that is the whole of R321's correction here: a sweep behind a
      # `_MINUTES > 0` switch that is switched off used not to be registered at
      # all, so it had no `background_sweep_runs_total` series, and
      # `rate(...) == 0` over a series that does not exist matches nothing. The
      # second half of the sentence above — "or the interval is configured to
      # zero" — was the one case this rule could not see. `enabled` now carries
      # a reading for every sweep the process knows of, so `unless` catches both
      # the enabled sweep whose timer has stopped and, should the roster and the
      # gauges ever drift apart again, the enabled sweep with no counter at all.
      #
      # Deliberately no rule on `background_sweep_enabled == 0`: a deployment
      # turning a sweep off is supported, and the boot line
      # ('background sweeps: not all scheduled', warn) is where an unintended
      # one is caught. What was missing was any way to tell "off" from "gone".
      - alert: SweepStopped
        expr: |
          background_sweep_enabled == 1 unless (rate(background_sweep_runs_total[1h]) > 0)
        for: 1h
        labels: { severity: page }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep has not run for an hour'

      # A scheduler routinely skipping ticks has an interval too short for its
      # work — the queue behind it is growing and nothing else says so.
      - alert: SweepOverlapping
        expr: rate(background_sweep_skipped_total[30m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep is skipping ticks; its interval is too short'

      # A tick that ran and looked at nothing.
      #
      # `SweepOverlapping` above is the *in-process* overlap: `nonOverlapping`
      # dropping a tick because the previous one on this instance had not
      # finished. Two of the twelve sweeps take a second, cross-instance guard
      # inside the tick — a Postgres session advisory lock — and declining that
      # one is not a dropped tick at all. The tick ran, returned normally, and
      # examined no rows, which is precisely the four zeros a pass that ran and
      # found nothing due returns.
      #
      # Every rule in this group is blind to it. The tick ran, so `SweepStopped`
      # is quiet; it did not throw, so `SweepFailing` is quiet; it did not
      # overlap in-process, so `SweepOverlapping` is quiet; and it failed no
      # rows, so `SweepWorkFailing` is quiet. So each sweep flattens the decline
      # into its tally — `auto-email` as `declined` (R340), `job-alerts` as
      # `skipped` (R321) — for the express purpose of separating the two, and
      # until R341 no rule read either field.
      #
      # The condition worth a rule is the *permanent* one, which is what both
      # fields were added for: `withSweepLock`'s own note describes a failed
      # unlock returning a live connection to the pool while it still holds a
      # session-scoped key, after which every later pass declines for ever and
      # the only line written for it is the benign `info`. A ratio against the
      # sweep's own ticks, not a count, because ordinary contention — the
      # interval and the admin button are the same function — is health.
      #
      # Summed across instances before the division: the question is estate-wide
      # ("no pass anywhere is running"), and per-instance a deployment where one
      # process reliably loses the race is a normal one. `sum by (sweep)` rather
      # than `sum`, so `{{ $labels.sweep }}` below has a label to render.
      #
      # Two rules rather than one with an `outcome=~"declined|skipped"`: the two
      # sweeps do not agree on the spelling, and `auto-email` *also* reports a
      # `skipped` — candidates passed over for want of a phone number, an
      # entirely ordinary outcome. A regex across both sweeps would page on it.
      - alert: DripScanNeverRuns
        expr: |
          sum by (sweep) (rate(background_sweep_items_total{sweep="auto-email",outcome="declined"}[2h]))
            / sum by (sweep) (rate(background_sweep_runs_total{sweep="auto-email"}[2h])) > 0.9
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: 'every {{ $labels.sweep }} pass is declining the scan lock — the drip campaigns have stopped'
          runbook: "journalctl -u n409-valuation | grep 'auto email scan declined'; then check pg_locks for a session-scoped advisory lock held by an idle connection"

      # The same shape on the sweep that watches every other queue, and a page
      # rather than a ticket for one reason: `job_queue_alert_open` is read from
      # the last scan's snapshot, so a monitor that has stopped scanning does
      # not go absent — it keeps publishing the verdict it reached before it
      # stopped. `JobQueueAlertOpen` then reports zero open alerts for every
      # queue with total confidence, which is the same reading a healthy estate
      # gives. Nothing else on this page is watching the outbox, the webhook
      # deliveries or the AI jobs; this sweep is.
      - alert: JobMonitorNeverRuns
        expr: |
          sum by (sweep) (rate(background_sweep_items_total{sweep="job-alerts",outcome="skipped"}[2h]))
            / sum by (sweep) (rate(background_sweep_runs_total{sweep="job-alerts"}[2h])) > 0.9
        for: 1h
        labels: { severity: page }
        annotations:
          summary: 'every {{ $labels.sweep }} pass is declining the scan lock — no queue is being watched'
          runbook: "journalctl -u n409-valuation | grep job_alert_scan_skipped; the gauges at /metrics are the last completed scan's verdict, not a current one"

      # The three rules above describe the *tick*: whether it ran, whether it
      # overlapped, whether it threw. None of them describes the work, and the
      # work is where these sweeps fail. Every ladder here contains its per-row
      # failures on purpose — one row's SMTP refusal must not cost the other
      # nineteen their attempt — so an outbox whose every send is refused, a
      # webhook receiver that has been 500ing since yesterday, and a retry sweep
      # stranding every run it claims all return normally, every tick, for ever.
      # `background_sweep_items_total` is the tally each tick already computed.
      - alert: SweepWorkFailing
        expr: |
          rate(background_sweep_items_total{outcome="failed"}[30m]) > 0
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep has been failing rows for an hour'
          runbook: 'journalctl -u n409-valuation | grep ''"sweep":"{{ $labels.sweep }}"'''

      # The ladder giving up. `retired` and `stranded` are the two endings no
      # later tick revisits — an outbox row whose attempts are spent, a pipeline
      # run abandoned mid-claim — so unlike `failed` there is no next attempt
      # that might make this right, and one is worth a look.
      - alert: SweepAbandoningWork
        expr: |
          increase(background_sweep_items_total{outcome=~"retired|stranded"}[6h]) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.sweep }} sweep has given up on rows nothing else will take'

      # An outcome the database refused to record, for a POST that had already
      # reached the receiver. `unsettled` is deliberately not `failed`: the
      # partner *got* the event, only the row does not say so, so the claim
      # lapsing sends it a second time. One is a blip on one statement; a rate
      # that does not fall is a partner processing duplicates of every event.
      - alert: WebhookOutcomesUnrecorded
        expr: |
          rate(background_sweep_items_total{sweep="webhook-retry",outcome="unsettled"}[30m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'partner webhook outcomes are going unrecorded — receivers are being sent duplicates'
          runbook: "journalctl -u n409-valuation | grep 'could not be settled'"

      # The alerting subsystem failing to report. `announceJobAlerts` retries
      # an announcement until it lands, so one failure is a database blip and
      # not news — but a count that keeps rising is an operator who has not been
      # told a queue is stalled, which is the one failure the job monitor exists
      # to prevent, and it reaches nothing else here.
      - alert: JobAlertAnnouncementsFailing
        expr: |
          rate(background_sweep_items_total{sweep="job-alerts",outcome="announcements_failed"}[30m]) > 0
        for: 30m
        labels: { severity: page }
        annotations:
          summary: 'job queue alerts have been failing to reach an operator for half an hour'
          runbook: "journalctl -u n409-valuation | grep 'job queue alert announcement failed'"

      # The queues themselves, as the job monitor judges them. `stalled` is the
      # oldest job that is *due now* having been due longer than the queue's
      # window — a stopped worker or a dead SMTP host; `failing` is a queue
      # moving fine and getting every answer wrong. Both thresholds are the
      # per-queue rules in `job_alert_rules`, so this rule deliberately restates
      # no number of its own: the judgement is already made, and until R321 it
      # was made every five minutes and told only an in-app notification list.
      #
      # `for` is short because the sweep's own reconciler is the de-duplicator:
      # an alert here has already survived a scan, and it stays open until the
      # condition clears.
      - alert: JobQueueAlertOpen
        expr: job_queue_alert_open == 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.source }} queue is {{ $labels.kind }}, per the job monitor'
          runbook: 'https://n409.aiknol.com/admin/jobs'

      # The gauge above is the monitor's verdict; this is whether it reached one.
      # A queue with no enabled rule produces no findings, so before R329 it
      # reported the same confident zero as a healthy watched one and
      # `JobQueueAlertOpen` could never fire for it again — for the outbox and
      # the webhook deliveries, that zero was the only thing anybody had, since
      # `auto_pipeline_runs_pending` delegates every DB-backed backlog here.
      #
      # Deliberately no rule on `state="disabled"`: switching a queue's rule off
      # in the admin console is supported, the same way a switched-off sweep is.
      # `unconfigured` is the one nobody chose — a source in JOB_SOURCES with no
      # row in `job_alert_rules`, unwatched since the day it was added.
      - alert: JobQueueUnwatched
        expr: job_queue_alert_rule{state="unconfigured"} == 1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.source }} queue has no alert rule at all — nothing is watching it'
          runbook: 'INSERT a row into job_alert_rules for it; the seed in migration 0120 has the thresholds the others use'

      - alert: AutoPipelineBacklog
        expr: auto_pipeline_runs_pending > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'auto-pipeline runs have been queued behind the concurrency limit for half an hour'

  - name: n409-database
    rules:
      # Anything waiting means the pool is saturated: the next query does not
      # run slowly, it does not run.
      - alert: PoolSaturated
        expr: db_pool_connections_waiting > 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'callers are queued for a pg client'

      # A leaked checkout never comes back on its own, so any increase is
      # permanent loss of pool capacity.
      - alert: PoolCheckoutLeaked
        expr: increase(db_pool_checkouts_leaked_total[1h]) > 0
        labels: { severity: page }
        annotations:
          summary: 'a pg connection was checked out and never returned'
          runbook: 'GET /api/v1/admin/db/pool; db/poolHealth.ts holds the stack of the oldest checkout'

      - alert: PoolCheckoutHeldTooLong
        expr: db_pool_checkout_oldest_seconds > 60
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: 'a pg connection has been held for over a minute'

      - alert: SlowQueriesAppearing
        expr: increase(db_slow_queries_total[15m]) > 20
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'statements are crossing the slow-query threshold'
          runbook: 'GET /api/v1/admin/db/queries for the ranked fingerprints'

  - name: n409-degraded-features
    rules:
      # The fallback keeps producing correct bytes, so a broken offload has no
      # other symptom — this process simply goes back to blocking its event loop
      # for half a second per report. `not_configured` is the deployment that
      # deliberately has no report unit and is excluded.
      - alert: ReportOffloadFailing
        expr: rate(report_render_total{mode="local", reason!="not_configured"}[30m]) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'PDF renders are falling back to the valuation process ({{ $labels.reason }})'

      - alert: ReportRenderQueueFull
        expr: report_render_delegations_queued > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'report renders are queueing for a delegation slot'

      # The engine turns every market-data failure into a 200 with
      # `source: "fallback"`, so a dead source produces correct-looking
      # valuations on substituted figures. There is no other symptom at all.
      - alert: MarketFeedFallingBack
        expr: |
          sum(rate(market_feed_answers_total{outcome="fallback"}[1h]))
            / sum(rate(market_feed_answers_total[1h])) > 0.5
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: 'over half of market-feed answers are substituted figures rather than observed ones'

  - name: n409-inbound-webhooks
    rules:
      # A webhook's whole authority is a signature, and the secret behind it is
      # held on two machines neither of which tells the other when it changes.
      # A rotation in the Stripe dashboard that misses this deployment refuses
      # every delivery: no payment is fulfilled, no refund recorded, no
      # subscription changes state, and a customer who has been charged has an
      # engagement that is still unpaid. `registerProblemHandler` leaves 4xx
      # unlogged on purpose — right for a browser, wrong for the one caller that
      # is a machine and cannot tell anybody it is being turned away.
      #
      # A ratio, not a count. These URLs are in PUBLIC_ROUTES and the internet
      # scans them, so a nonzero refusal rate is the normal condition of an
      # endpoint on the internet. What is not normal is refusing most of what
      # arrives — and `unsigned` is deliberately excluded from the numerator,
      # because a scanner POSTing junk is exactly the traffic that must not be
      # able to page somebody.
      - alert: InboundWebhookSecretDrifted
        expr: |
          sum by (source) (rate(inbound_webhook_deliveries_total{outcome="bad_signature"}[30m]))
            / sum by (source) (rate(inbound_webhook_deliveries_total{outcome!="unsigned"}[30m])) > 0.5
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "the {{ $labels.source }} webhook is refusing signed deliveries — its secret and the sender's have drifted"
          runbook: "journalctl -u n409-valuation | grep inbound_webhook — then compare the endpoint secret in the provider dashboard with this deployment's"

      # The other half: the door is open and nothing is behind it. A deploy that
      # brought up the service without the secret answers every delivery 503,
      # the provider retries for days and gives up, and the events are gone.
      - alert: InboundWebhookUnconfigured
        expr: rate(inbound_webhook_deliveries_total{outcome="unconfigured"}[1h]) > 0
        for: 15m
        labels: { severity: page }
        annotations:
          summary: 'the {{ $labels.source }} webhook is being called and has no signing secret configured'

  - name: n409-identity
    rules:
      # An SSO refusal is a 302. R273 said so in as many words when it gave
      # these refusals a log line: "a refusal that becomes a 302 is a 302 in the
      # access log, indistinguishable from the successful hand-off two lines
      # below it". The half that was left is that the log is not the alerting
      # channel here.
      #
      # So an expired IdP signing certificate, a rotated Google client secret or
      # an administrator narrowing the allowed domain refuses every sign-in at a
      # firm, and each refusal is counted by `http_requests_total` in the 3xx
      # class beside every ordinary redirect on the platform. No 5xx, no slow
      # request, no circuit — the IdP is not one of ours. Nobody can sign in and
      # every other instrument reads green.
      #
      # A ratio against `signed_in`, and sustained: one person with a personal
      # address hitting `domain_not_allowed` is Tuesday. Half an hour in which
      # most attempts are refused is a setting somebody changed.
      #
      # `mfa_challenged` is excluded from both halves, for the reason
      # `SignInsFailing` excludes it from the password door's ratio: since R354
      # an account that has enrolled a second factor here is answered by either
      # SSO flow with a challenge rather than a session, and that is neither a
      # sign-in nor a refusal. Counting it as a refusal would page on a firm
      # that has mandated 2FA; counting it as a sign-in would let a wall of
      # challenges hide a hand-off refusing everybody else.
      - alert: SsoRefusingSignIns
        expr: |
          sum by (flow) (rate(sso_outcomes_total{outcome!~"signed_in|mfa_challenged"}[30m]))
            / sum by (flow) (rate(sso_outcomes_total{outcome!="mfa_challenged"}[30m])) > 0.5
        for: 30m
        labels: { severity: page }
        annotations:
          summary: 'most {{ $labels.flow }} sign-in attempts are being refused'
          runbook: "journalctl -u n409-valuation | grep ssoRefusal — the code names which of the ten reasons, and half of them are a setting inside the firm's own identity provider"

      # The two codes that are never a caller's doing. `assertion_rejected` is a
      # signature, a condition window or a profile we will not trust;
      # `provider_error` is the IdP not answering usefully at all. Either one
      # arriving at any rate is worth a look before it becomes the rule above,
      # and unlike that ratio this fires on the first firm to hit it rather than
      # waiting for them to outnumber everybody signing in successfully.
      - alert: SsoProviderRejecting
        expr: |
          sum by (flow) (rate(sso_outcomes_total{outcome=~"assertion_rejected|provider_error"}[30m])) > 0
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.flow }} assertions are being rejected or the provider is not answering'

      # The third door whose authority is a shared secret, and the one whose
      # silence lasts longest. A SCIM bearer is rotated in the admin console or
      # retyped wrong in Okta / Entra / OneLogin, and `requireToken` answers 401
      # to every create, every `PATCH active:false` and every `DELETE` — with no
      # log line, in a status class this box has no rule on, against a route
      # whose only other reader is the IdP's connector log inside somebody
      # else's tenant.
      #
      # What that costs is the automated half of offboarding: since R336 the
      # directory's deprovision is what drops a departing employee's roles and
      # releases their engagements and review tasks. A refused token stops all
      # of it, and the account stays live.
      #
      # A ratio against `accepted`, and `unauthenticated` excluded from the
      # numerator, for the reason `InboundWebhookSecretDrifted` gives: this
      # prefix is on the open internet, a bearer-guarded URL refusing a request
      # that carries no bearer is the endpoint working, and a scanner must not
      # be able to page anybody.
      - alert: ScimTokenDrifted
        expr: |
          sum(rate(scim_requests_total{outcome="bad_token"}[30m]))
            / sum(rate(scim_requests_total{outcome!="unauthenticated"}[30m])) > 0.5
        for: 30m
        labels: { severity: page }
        annotations:
          summary: "the directory connector is being refused — its SCIM token and this deployment's have drifted"
          runbook: "journalctl -u n409-valuation | grep 'SCIM request refused' — then re-issue the token in the admin console and paste it into the IdP"

      # The other way provisioning stops without anybody being told. The per-IP
      # throttle is sized for a real IdP (600 in five minutes, a few hundred
      # users resyncing comfortably inside one window), so sustained 429s mean
      # a directory larger than that assumption or a connector in a retry loop
      # — and either way the tail of the resync is not being applied.
      - alert: ScimThrottled
        expr: rate(scim_requests_total{outcome="rate_limited"}[15m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'the directory connector is being throttled; the tail of its resync is not being applied'

      # The door people use, and the last one in this group to get a rule.
      #
      # Every machine door above is here because its refusal is answered in a
      # status class nothing watches — a 302 for SSO and the OAuth callbacks, a
      # 401 for SCIM and the API keys below. The interactive door is the same
      # failure in the plainest form: `POST /auth/login` answers a refusal with
      # 401 and a lockout with 429, and there is no 4xx rule on this box at all.
      # A password verifier that stopped verifying after a deploy, a session
      # issuer throwing inside a branch that catches, a `users` table that came
      # back from a migration with the digests where nothing reads them — every
      # one of those refuses every sign-in on the estate with no 5xx, no slow
      # request and no open circuit, because the identity store is our own
      # Postgres and it is answering perfectly well.
      #
      # A ratio, and `mfa_challenged` excluded from both halves of it. An
      # account with 2FA on is *answered* by the password door with a challenge
      # rather than a session: counting those as refusals would make a firm that
      # has mandated 2FA look like a firm that cannot get in, and counting them
      # as sign-ins would let a wall of them hide a door refusing everybody else.
      #
      # `by (door)` so the two halves are judged apart. They fail for unrelated
      # reasons, and the second fails alone far more often — a clock that has
      # drifted on the box, or a TOTP secret encrypted under a key that was
      # rotated, locks out every 2FA account while password sign-in, which is
      # the half somebody would think to test, keeps working.
      - alert: SignInsFailing
        expr: |
          sum by (door) (rate(sign_in_outcomes_total{outcome!~"signed_in|mfa_challenged"}[30m]))
            / sum by (door) (rate(sign_in_outcomes_total{outcome!="mfa_challenged"}[30m])) > 0.8
        for: 30m
        labels: { severity: page }
        annotations:
          summary: 'most attempts at the {{ $labels.door }} sign-in door are being refused'
          runbook: "the spine carries the reason per attempt: SELECT payload->>'reason', count(*) FROM admin_events WHERE type = 'user_login_failed' AND occurred_at > now() - interval '1 hour' GROUP BY 1"

      # Somebody walking an address list, which is the one condition in this
      # group that is not the platform doing something to itself.
      #
      # `unknown_account` is its own outcome rather than folded in with the
      # other refusals precisely so this can be asked separately. A handful is
      # Tuesday — a typo, an old work address, somebody who signed up with the
      # other one — and a sustained rate of addresses that have never existed
      # here is a credential list being tried against the platform. A ticket
      # rather than a page for the reason SCIM keeps `unauthenticated` out of
      # its numerator: this door faces the open internet, and a stranger must
      # not be able to wake anybody.
      #
      # A floor on the real rate, not a measure of it: an address is locked at
      # its tenth attempt and everything past that counts as `throttled`.
      - alert: SignInAddressSweep
        expr: |
          sum(rate(sign_in_outcomes_total{door="password",outcome="unknown_account"}[30m])) > 0.1
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: 'sign-ins are being attempted against addresses that have no account here — an address list is being walked'
          runbook: "SELECT payload->>'ip', count(*) FROM admin_events WHERE type = 'user_login_failed' AND payload->>'reason' = 'unknown_account' AND occurred_at > now() - interval '1 hour' GROUP BY 1 ORDER BY 2 DESC"

  - name: n409-api-keys
    rules:
      # The door with no person behind it to notice, which is this estate's own
      # phrase for it (`ApiTokenRefusal.partner_retired`).
      #
      # A refused API key is one `problems.unauthorized(...)` — no log line, no
      # event row, and a 4xx counted beside every mistyped password on the box.
      # So a partner's integration stops dead and neither side can see it: the
      # firm's console is behind the same key, and for two of the five refusals
      # that console is refused too.
      #
      # Three of the five are conditions this platform caused. An administrator
      # archived the firm, moved the member who minted the key out of it, or
      # closed their account — each a deliberate act about a person or an
      # organisation, with a consequence nobody was looking at: a running
      # integration that reads cap tables, creates engagements and uploads
      # documents simply stops. The remedy for all three is on this side, which
      # is exactly why the silence mattered.
      #
      # `> 0` on the increase rather than a ratio. A ratio needs a denominator
      # from the same firm and the counter is deliberately unlabelled by partner
      # — one series per firm is the cardinality this file will not take — but
      # more than that, one of these is already wrong. There is no healthy rate
      # of "the organisation this key acts for has been archived".
      #
      # `revoked` and `unknown` are excluded and that is the whole judgement
      # here: revoking a key is a deliberate act by somebody who knows they did
      # it, and `unknown` is the internet finding a bearer endpoint. Neither may
      # wake anybody. `ApiTokenAuthOutcome` holds the pair of lists together.
      - alert: PartnerIntegrationLockedOut
        expr: increase(api_token_auth_total{outcome=~"partner_retired|orphaned|no_owner"}[30m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'an integration is being refused for something this platform did ({{ $labels.outcome }})'
          runbook: 'journalctl -u n409-valuation --grep=api-token for the apiTokenId and partnerId; then un-archive the partner, restore the membership, or have the firm mint a key under a current user'

  - name: n409-browser
    rules:
      # A release that blanks a route for every user leaves the access log full
      # of 200s: the shell and the bundle both serve fine. This counter is the
      # only thing on the box that can see it.
      - alert: ClientCrashSpike
        expr: sum(rate(client_errors_total[10m])) > 0.2
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'the browser app is crashing for users — check the last release'
          runbook: 'journalctl -u n409-valuation | grep client_error — the stack and page are on the line'

      # The reports are throttled per address, so this firing means the counter
      # above is capped and is no longer the whole story.
      - alert: ClientCrashReportsDropped
        expr: rate(client_errors_dropped_total[15m]) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: 'crash reports are being refused by the throttle; client_errors_total is an undercount'

  - name: n409-integration-connects
    rules:
      # The three OAuth connect doors — HRIS, accounting, cap-table sync — whose
      # every outcome, refusals included, is a 302. `ssoOutcomes.ts` established
      # the shape one flow over and the argument is the same: a refusal answered
      # as a redirect is counted in `http_requests_total`'s 3xx class beside
      # every ordinary navigation, `HighServerErrorRate` sees no 5xx,
      # `SlowRequests` sees nothing, and the breakers see nothing because the
      # provider is not one of ours. Three of the five outcomes wrote nothing at
      # all until R341, so a rotated client secret or a redirect URI that no
      # longer matches refuses every connection with every instrument green.
      #
      # `denied` is the provider's side saying no, and it is the one that
      # catches a misconfigured OAuth app: the provider refuses before we are
      # ever asked, so nothing downstream of the callback runs. A ratio against
      # every outcome, because one person clicking Deny on a consent screen is
      # Tuesday and nothing but `denied` for an afternoon is a setting somebody
      # changed. `for` is long because these are hand-driven flows: a firm makes
      # a handful of connections a week, not a stream.
      - alert: IntegrationConnectsRefusedByProvider
        expr: |
          sum by (family) (rate(integration_callback_outcomes_total{outcome="denied"}[6h]))
            / sum by (family) (rate(integration_callback_outcomes_total[6h])) > 0.8
        for: 2h
        labels: { severity: ticket }
        annotations:
          summary: 'the {{ $labels.family }} provider is refusing every connection attempt — check the client secret and the redirect URI'
          runbook: "journalctl -u n409-valuation | grep 'integration callback'"

      # And this platform refusing on the far side of the hop. `retired` is the
      # engagement withdrawn while somebody was on a consent screen and
      # `unauthorized` is the actor's access ending inside the token's thirty
      # minutes — closed, suspended, demoted, or moved out of a partner's scope.
      # Both are ordinary one at a time, which is why this is a count over a long
      # window rather than a ratio: several in a day is a role migration or a
      # retirement sweep turning away connections nobody realises are failing,
      # and `unauthorized` in particular is a stale credential being presented.
      - alert: IntegrationConnectsRefusedLocally
        expr: |
          sum by (family) (increase(integration_callback_outcomes_total{outcome=~"retired|unauthorized"}[6h])) > 3
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.family }} connections are being refused after the OAuth hop — the engagement or the actor changed mid-flow'
          runbook: "journalctl -u n409-valuation | grep 'integration callback refused'"
