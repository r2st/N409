[project]
name = "n409-ai"
version = "0.1.0"
description = "409.ai rebuild — AI service (pipelines, prompt registry, model routing). M0: skeleton + health."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
