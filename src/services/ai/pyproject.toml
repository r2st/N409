[project]
name = "n409-ai"
version = "0.1.0"
description = "409.ai rebuild — AI service. M1: missing-data / extraction / comparables pipelines via OpenRouter."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    # Keep in step with requirements.txt, which carries the reasoning: 6.15.0 is
    # the fix for PYSEC-2026-3655/3656, both reachable through the text
    # extraction `documents.py` runs over uploaded files.
    "pypdf>=6.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
