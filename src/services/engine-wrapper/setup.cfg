[mutmut]
# Mutation testing for the numeric core: `.venv/bin/mutmut run` from this
# directory, per docs/mutation-testing.md. This line used to name an
# `npm run mutants` that the root package.json has never defined.
# The whole `app/` package is copied so the FastAPI
# endpoint tests still import `app.main`, but only the pure engine functions are
# actually mutated: those are what decide the number a valuation reports, and a
# surviving mutant there means a wrong FMV no test would catch. `app/main.py` is
# request plumbing, excluded so its mutants don't dilute the score.
#
# The whole thing is viable only because the pytest suite runs in ~1s.
source_paths=app/
do_not_mutate=
    app/main.py
