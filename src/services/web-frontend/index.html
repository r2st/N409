<!doctype html>

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />
    <!--
      Resolve the theme before first paint, otherwise a dark-mode user sees a
      white flash while the bundle boots. This has to be inline and synchronous
      in <head> for that reason, so it deliberately duplicates the storage key
      and the resolution rule from src/lib/theme.ts — keep the two in step.
    -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('n409.theme');
          if (c !== 'light' && c !== 'dark') {
            c = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', c);
          if (c === 'light') {
            document.querySelector('meta[name="theme-color"]').content = '#0b1220';
            document.querySelector('meta[name="color-scheme"]').content = 'light';
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <!--
      Head metadata comes from two renderers (409.ai section 24):

        * at build time, baked into each marketing route's own document by the
          prerender plugin (src/lib/prerender.ts). This is what social crawlers
          and link unfurlers read, since they never execute JavaScript.
        * at runtime, applied by react-helmet-async via the Seo component once
          the bundle boots. This is what a browser ends up with.

      Both render from one builder (src/lib/headTags.ts), so they agree.

      Everything between the two n409:head-fallback markers below is the shell
      fallback: the prerenderer replaces that whole block with the route's real
      metadata, so what remains here is only ever seen on an un-prerendered
      route (the SPA fallback for the authenticated app, which robots.txt
      excludes from crawling anyway). Do not add Open Graph tags here — they
      would duplicate the prerendered ones.
    -->
