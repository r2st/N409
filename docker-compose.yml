name: n409

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n409
      POSTGRES_PASSWORD: n409_dev
      POSTGRES_DB: n409_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n409 -d n409_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  valuation:
    build:
      context: .
      dockerfile: src/services/valuation/Dockerfile
    restart: unless-stopped
    # Matched to systemd's TimeoutStopSec=30. Docker's default is 10s, and the
    # Node graceful shutdown takes up to 10s (shared/shutdown.ts) — so the
    # default would SIGKILL at the exact instant the app gives up, turning a
    # clean exit into a race. 30s gives the same margin the unit file does.
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://n409:n409_dev@postgres:5432/n409_dev
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      # Containers must bind their own interface, not loopback: Docker publishes
      # a port by reaching the container's eth0, so 127.0.0.1 inside the
      # container is unreachable from the host. The services default to loopback
      # (shared/listen.ts) precisely so this has to be opted into.
      HOST: '0.0.0.0'
      PORT: '3001'
      LOG_LEVEL: info
      AI_URL: http://ai:3002
      ENGINE_URL: http://engine-wrapper:3003
      # Shared secret injected as X-Internal-Token on every AI/engine call (P0).
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
    ports:
      - '3001:3001'
    # Healthcheck via the Node runtime (no curl/wget in the image) (audit I-1 P2).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/services/web/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOST: '0.0.0.0'
      PORT: '3000'
      VALUATION_URL: http://valuation:3001
      AI_URL: http://ai:3002
      ENGINE_URL: http://engine-wrapper:3003
      # /ready checks Postgres directly so a DB outage is attributable at the
      # edge rather than only as three simultaneous upstream failures.
      DATABASE_URL: postgres://n409:n409_dev@postgres:5432/n409_dev
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # Wait for the API to be healthy, not merely started (audit I-1 P2).
    depends_on:
      valuation:
        condition: service_healthy

  ai:
    build:
      context: src/services/ai
    restart: unless-stopped
    stop_grace_period: 30s
    # Internal service — reachable only on the compose network, no host port
    # (audit B-1 P0 / I-1 P3). It listens on all interfaces *inside* the
    # container but is never published to the host.
    environment:
      HOST: '0.0.0.0'
      PORT: '3002'
      # The comparable-company agent verifies tickers against the engine.
      ENGINE_URL: 'http://engine-wrapper:3003'
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
    expose:
      - '3002'
    # /health is a public path (no internal token needed); check via stdlib urllib.
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.healthcheck']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      engine-wrapper:
        condition: service_healthy

  engine-wrapper:
    build:
      context: .
      dockerfile: src/services/engine-wrapper/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    # Internal service — no host port (audit B-1 P0 / I-1 P3).
    environment:
      HOST: '0.0.0.0'
      PORT: '3003'
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
    expose:
      - '3003'
    healthcheck:
      test: ['CMD', 'python', '-m', 'app.healthcheck']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          # CPU-bound OPM/waterfall compute — give it more headroom.
          cpus: '2.0'
          memory: 1024M

  report:
    build:
      context: .
      dockerfile: src/services/report/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    # Internal service — no host port (audit I-1 P3).
    environment:
      # Reachable on the compose network only (`expose`, not `ports`), which
      # still needs the container's own interface rather than loopback.
      HOST: '0.0.0.0'
      PORT: '3004'
      # Same shared secret the AI and engine services require. `expose` puts
      # this on the compose network, so the header is what actually gates it.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token-change-me}
    expose:
      - '3004'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  pgdata:
