name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, build & test (Node services)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: n409
          POSTGRES_PASSWORD: n409_dev
          POSTGRES_DB: n409_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n409 -d n409_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://n409:n409_dev@localhost:5432/n409_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef-0123456789

  python:
    name: Test (Python services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai, engine-wrapper]
    defaults:
      run:
        working-directory: src/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - name: Build valuation image
        run: docker build -f src/services/valuation/Dockerfile .
      - name: Build ai image
        run: docker build src/services/ai
      - name: Build engine-wrapper image
        run: docker build src/services/engine-wrapper

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform
