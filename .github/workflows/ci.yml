name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, build & test (Node services)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: n409
          POSTGRES_PASSWORD: n409_dev
          POSTGRES_DB: n409_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n409 -d n409_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://n409:n409_dev@localhost:5432/n409_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef-0123456789
      # Coverage with an enforced per-package floor (audit T-2 / P2-2). The
      # thresholds live in each package's vitest config; `--coverage` makes these
      # steps fail if coverage drops below the agreed baseline.
      - name: Coverage (shared)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/packages/shared
      - name: Coverage (valuation)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/services/valuation
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef-0123456789
      - name: Coverage (web-frontend)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/services/web-frontend
      # `web` and `report` had no floor at all until now — the BFF is the only
      # service the public internet reaches directly, and `report` renders the
      # document the client and their auditor actually read.
      - name: Coverage (web)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/services/web
      - name: Coverage (report)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/services/report

  python:
    name: Test (Python services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai, engine-wrapper]
    defaults:
      run:
        working-directory: src/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Coverage with an enforced floor (audit T-2 P2).
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # infra/*.sh restart production and rotate backups. A quoting slip in one
      # of them is not caught by any other job — the Node and Python suites
      # never execute them, and deploy.sh's own tests exercise behaviour rather
      # than lint. shellcheck is the only thing that reads them as shell.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning infra/deploy.sh infra/backup/*.sh infra/firewall/*.sh

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The backlog this gate was waiting on has cleared: round 74 took the tree
      # from 26 advisories (4 high, 22 moderate — the whole OpenTelemetry stack)
      # to zero, so the "tighten once the backlog clears" note is now cashed in
      # and high fails the pipeline rather than printing into a log nobody reads.
      #
      # Moderate stays advisory on purpose. It is the tier that fires on
      # transitive dev-only packages with no fix published yet, and a gate that
      # blocks on something unfixable is a gate that gets bypassed.
      - name: npm audit (block high & critical)
        run: npm audit --audit-level=high
      - name: npm audit (report moderate)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Gating, like npm audit above. It was advisory, and an advisory scan is
      # one nobody reads: these two lines printed green for months while the
      # deployed ai venv carried two pypdf advisories, and would have printed
      # the same had the *spec* been vulnerable too.
      #
      # Note what this can and cannot see. `-r` resolves the floors against PyPI
      # and audits the result, so it answers "would a fresh install today be
      # safe?" — worth blocking on, since that is what a new host and every
      # requirements.txt change actually get. It says nothing about the venvs
      # already on the deploy target, which are not fresh installs and drift
      # below the floors silently; `tools/check_installed_deps.py`, run by
      # infra/deploy.sh against the host, is the half that covers those.
      - name: pip-audit (Python services)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r src/services/ai/requirements.txt
          pip-audit -r src/services/engine-wrapper/requirements.txt
      # The one thing in this pipeline that was never verified was the
      # verifier. `curl ... | tar -xz` streams a release asset straight into an
      # extractor and then executes it, in a job that has the whole repository
      # and the workflow token in scope — so whoever can change what that URL
      # serves (a re-tagged release, a compromised release token, a proxy in
      # front of the runner) runs code here, and nothing downstream would say
      # so. A tag is a mutable pointer; a digest is not.
      #
      # Downloading to a file first is the load-bearing half: a pipeline cannot
      # be checked before its consumer has already read it. The digest below is
      # the one gitleaks publishes in gitleaks_8.21.2_checksums.txt, confirmed
      # against a separately fetched copy of the asset on 2026-08-28. Bumping
      # GL_VERSION without bumping GL_SHA256 fails the step rather than
      # silently trusting the new bytes.
      - name: gitleaks (committed secret scan)
        run: |
          GL_VERSION=8.21.2
          GL_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSL --retry 3 --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - name: Build valuation image
        run: docker build -f src/services/valuation/Dockerfile .
      - name: Build web (BFF) image
        run: docker build -f src/services/web/Dockerfile .
      - name: Build ai image
        run: docker build src/services/ai
      - name: Build engine-wrapper image
        run: docker build src/services/engine-wrapper

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform
