name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint, build & test (Node services)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: n409
          POSTGRES_PASSWORD: n409_dev
          POSTGRES_DB: n409_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n409 -d n409_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://n409:n409_dev@localhost:5432/n409_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef-0123456789
      # Coverage measurement (audit T-2 P2). Report-only for now — a floor can be
      # enforced per package once the baselines are agreed.
      - name: Coverage (shared)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/packages/shared
      - name: Coverage (valuation)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/services/valuation
        env:
          JWT_SECRET: ci-only-secret-0123456789abcdef-0123456789
      - name: Coverage (web-frontend)
        run: npx vitest run --coverage --coverage.reporter=text-summary
        working-directory: src/services/web-frontend

  python:
    name: Test (Python services)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai, engine-wrapper]
    defaults:
      run:
        working-directory: src/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Coverage with an enforced floor (audit T-2 P2).
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Block criticals hard; surface high/moderate without failing the pipeline
      # (they're tracked/fixed by Dependabot). Tighten once the backlog clears.
      - name: npm audit (block criticals)
        run: npm audit --audit-level=critical
      - name: npm audit (report high & moderate)
        run: npm audit --audit-level=high
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (Python services)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r src/services/ai/requirements.txt
          pip-audit -r src/services/engine-wrapper/requirements.txt
        continue-on-error: true
      - name: gitleaks (committed secret scan)
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --config .gitleaks.toml

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - name: Build valuation image
        run: docker build -f src/services/valuation/Dockerfile .
      - name: Build web (BFF) image
        run: docker build -f src/services/web/Dockerfile .
      - name: Build ai image
        run: docker build src/services/ai
      - name: Build engine-wrapper image
        run: docker build src/services/engine-wrapper

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform
